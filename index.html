<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Assistant</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <div class="container">

        <header>
            <div class="logo">🤖</div>

            <div>
                <h1>AI Assistant</h1>
                <p>Твой персональный ассистент</p>
            </div>
        </header>


        <section class="status-card">

            <div>
                <span class="status-dot"></span>
                <span id="statusText">Автоответчик включён</span>
            </div>

            <button id="toggleButton">
                ВЫКЛЮЧИТЬ
            </button>

        </section>


        <section class="section">

            <h2>Настройки</h2>

            <button class="menu-button" id="exceptionsButton">
                <span>👤</span>

                <div>
                    <strong>Исключения</strong>
                    <small>Кому AI не отвечает</small>
                </div>

                <span>›</span>
            </button>


            <button class="menu-button" id="styleButton">
                <span>🧠</span>

                <div>
                    <strong>Мой стиль</strong>
                    <small>Как AI должен общаться</small>
                </div>

                <span>›</span>
            </button>


            <button class="menu-button" id="memoryButton">
                <span>💬</span>

                <div>
                    <strong>Память</strong>
                    <small>История общения</small>
                </div>

                <span>›</span>
            </button>

        </section>


        <section class="info-card">

            <h3>AI Assistant</h3>

            <p>
                Ассистент может автоматически отвечать
                на твои личные сообщения в Telegram
                в соответствии с твоими настройками.
            </p>

        </section>

    </div>


    <script src="app.js"></script>

</body>
</html>
